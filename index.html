<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Change Maker</title>
  <meta name="description" content="The Change Maker — a new initiative launching soon.">
  <link rel="canonical" href="https://the-change-maker.org/">
  <style>
    :root { --bg:#0f172a; --fg:#f8fafc; --muted:#94a3b8; --accent:#34d399; }
    * { box-sizing:border-box; margin:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center;
    }
    h1 { font-size:clamp(2.2rem,7vw,4rem); letter-spacing:-0.02em; }
    h1 span { color:var(--accent); }
    p { color:var(--muted); margin-top:16px; font-size:1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>The <span>Change</span> Maker</h1>
    <p>Something new is on the way. Check back soon.</p>
  </main>
</body>
</html>
